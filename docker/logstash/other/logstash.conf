input {
  beats {
    port => 5044
  }
}

filter {
  # Parse the JSON message from Deck
  if [message] =~ /^\s*{/ {
    json {
      source => "message"
      target => "app"
    }

    # Move fields to ECS-style for Kibana Observability
    if [app][service] {
      mutate { rename => { "[app][service]" => "[service][name]" } }
    }
    if [app][level] {
      mutate { rename => { "[app][level]" => "[log][level]" } }
    }
  }

  # Optional: parse timestamp if present
  if [app][timestamp] {
    date {
      match => ["[app][timestamp]", "ISO8601"]
      target => "@timestamp"
      ignore_failure => true
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "deck-logs-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}
