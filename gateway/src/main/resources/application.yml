server:
  port: 8100
spring:
  application:
    name: gateway
  config:
    import: "optional:consul:"
  cloud:
    consul:
      enabled: true
      discovery:
        query-passing: true
        hostname: consul
        health-check-path: /actuator/health
        prefer-ip-address: false
        health-check-url: http://gateway:8100/actuator/health
      config:
        data-key: application.yml
        format: yaml
        default-context: defaults
        prefixes: config
      host: consul
    gateway:
      server:
        webflux:
          routes:
            - id: deck
              uri: lb://deck/
              predicates:
                - Path=/api/deck
            - id: round
              uri: lb://round/
              predicates:
                - Path=/api/round, /api/round/**
            - id: automaplayer
              uri: lb://automaplayer/
              predicates:
                - Path=/api/automa/**
            - id: resolver
              uri: lb://resolver/
              predicates:
                - Path=/api/resolver/**
          globalcors:
            corsConfigurations:
              '[/**]':
                allowedOrigins: "http://localhost:5173"
                allowedHeaders: "*"
                allowedMethods:
                - "GET"
                - "POST"
                - "PUT"
                - "OPTIONS"
                allowCredentials: true
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always