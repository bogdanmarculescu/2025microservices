server:
  port: 8100
spring:
  application:
    name: gateway
  config:
    import: "optional:consul:"
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/micro2025
  cloud:
    consul:
      enabled: true
      discovery:
        query-passing: true
        hostname: consul
        health-check-path: /actuator/health
        prefer-ip-address: false
        health-check-url: http://gateway:8100/actuator/health
      config:
        data-key: application.yml
        format: yaml
        default-context: defaults
        prefixes: config
      host: consul
    gateway:
      server:
        webflux:
          routes:
            - id: deck
              uri: lb://deck
              predicates:
                - Path=/api/deck/**
            - id: round
              uri: lb://round
              predicates:
                - Path=/api/round, /api/round/**
            - id: automaplayer
              uri: lb://automaplayer
              predicates:
                - Path=/api/automa/**
            - id: resolver
              uri: lb://resolver
              predicates:
                - Path=/api/resolver/**
            - id: resolversec
              uri: lb://resolver
              predicates:
                - Path=/api/secured/**

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always