spring.application.name=mono

server.port=8000

deck.client.host=http://deck:8001/api/deck
automa.client.host=http://automaplayer:8003/api/automa

amqp.exchange.name=round.exchange

spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672

spring.datasource.url=jdbc:postgresql://postgres:5432/rounds
spring.datasource.username=serviceuser
spring.datasource.password=servicepwd
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect